<style>
  @import url('https://fonts.googleapis.com/css2?family=Concert+One&family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Fredoka:wght@500;600&display=swap');

  #cs-root {
    --cream: #F4EEE1;
    --parchment-deep: #EAE1CC;
    --ink: #3B3128;
    --ink-soft: #6B5F51;
    --muted: #C9C1AF;
    --muted-line: #F4EEE1;
    --stamp-red: #A36361;
    --gold: #D89D49;

    --c-north_america: #7C919A;
    --c-latin_america: #A36361;
    --c-europe: #E48150;
    --c-middle_east_north_africa: #D18577;
    --c-sub_saharan_africa: #EFC16C;
    --c-russia_central_asia: #609595;
    --c-east_asia: #A96338;
    --c-south_asia: #81B1CD;
    --c-southeast_asia: #C96349;
    --c-oceania: #80BEAF;

    background: var(--cream);
    color: var(--ink);
    font-family: 'Urbanist', sans-serif;
    padding: 40px clamp(16px, 4vw, 56px) 60px;
    max-width: 1280px;
    margin: 0 auto;
    box-sizing: border-box;
    position: relative;
  }
  #cs-root *, #cs-root *:before, #cs-root *:after { box-sizing: border-box; }

  .cs-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 18px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 8px;
  }
  .cs-title-block { display: flex; align-items: center; gap: 16px; }
  .cs-compass { width: 46px; height: 46px; flex-shrink: 0; opacity: 0.85; }
  .cs-title-block h1 {
    font-family: 'Concert One', cursive;
    font-weight: 400;
    font-size: clamp(28px, 4.2vw, 42px);
    margin: 0;
    letter-spacing: 0.3px;
    color: var(--ink);
  }
  .cs-title-block p {
    margin: 4px 0 0;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 15px;
  }
  .cs-progress {
    font-family: 'Fredoka', sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    background: var(--parchment-deep);
    border: 1.5px dashed var(--ink-soft);
    border-radius: 30px;
    padding: 8px 18px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .cs-progress strong { color: var(--stamp-red); font-size: 15px; }

  .cs-map-wrap {
    position: relative;
    margin-top: 28px;
    background: var(--parchment-deep);
    border-radius: 18px;
    padding: clamp(10px, 2.5vw, 28px);
    box-shadow: inset 0 0 0 1.5px rgba(59,49,40,0.12);
  }

  #cs-map { width: 100%; height: auto; display: block; overflow: visible; }

  .cs-region {
    stroke: var(--muted-line);
    stroke-width: 2;
    stroke-linejoin: round;
    fill: var(--muted);
    transition: fill 0.5s ease, transform 0.25s ease, filter 0.25s ease;
    transform-origin: center;
    transform-box: fill-box;
  }
  .cs-region.locked {
    cursor: default;
  }
  .cs-region.locked:hover {
    filter: brightness(0.94);
  }
  .cs-region.unlocked {
    cursor: pointer;
  }
  .cs-region.unlocked:hover {
    filter: brightness(1.08) saturate(1.1);
    transform: scale(1.012);
  }
  .cs-region.shake {
    animation: cs-shake 0.4s ease;
  }
  @keyframes cs-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  .cs-tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: var(--cream);
    font-family: 'Fredoka', sans-serif;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 8px;
    transform: translate(-50%, calc(-100% - 12px));
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 5;
  }
  .cs-tooltip:after {
    content: '';
    position: absolute;
    top: 100%; left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: var(--ink);
  }
  .cs-tooltip.show { opacity: 1; }
  .cs-tooltip .cs-tt-status { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; opacity: 0.75; margin-top: 1px; }

  .cs-stamps {
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .cs-stamp {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--cream);
    border: 1.5px solid var(--muted);
    border-radius: 12px;
    padding: 10px 14px;
    text-decoration: none;
    color: var(--ink);
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    cursor: default;
  }
  .cs-stamp .cs-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    box-shadow: inset 0 0 0 2px rgba(59,49,40,0.15);
  }
  .cs-stamp .cs-label {
    font-family: 'Urbanist', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    line-height: 1.2;
  }
  .cs-stamp .cs-status {
    display: block;
    font-weight: 500;
    font-size: 10.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-top: 1px;
  }
  .cs-stamp.unlocked {
    cursor: pointer;
    border-color: var(--ink);
    box-shadow: 1px 2px 0 rgba(59,49,40,0.15);
  }
  .cs-stamp.unlocked:hover {
    transform: translateY(-2px);
    box-shadow: 2px 4px 0 rgba(59,49,40,0.2);
  }
  .cs-stamp.unlocked .cs-status { color: inherit; font-weight: 700; }

  .cs-footnote {
    margin-top: 22px;
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
    text-align: center;
  }

  @media (max-width: 600px) {
    .cs-header { align-items: flex-start; }
    .cs-stamps { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  }
</style>

    var path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', REGION_PATHS[key]);
    path.setAttribute('class', 'cs-region ' + (isUnlocked ? 'unlocked' : 'locked'));
    path.setAttribute('data-region', key);
    if (isUnlocked) {
      path.style.fill = 'var(--c-' + key + ')';
    }

    path.addEventListener('mouseenter', function (e) { showTooltip(e, key, info); });
    path.addEventListener('mousemove', function (e) { moveTooltip(e); });
    path.addEventListener('mouseleave', hideTooltip);
    path.addEventListener('click', function () {
      if (isUnlocked) {
        go(info.url);
      } else {
        path.classList.remove('shake');
        void path.offsetWidth;
        path.classList.add('shake');
      }
    });
    path.addEventListener('touchstart', function (e) { showTooltip(e, key, info); }, { passive: true });

    svg.appendChild(path);
  });

  progressCount.textContent = unlockedCount;

  function showTooltip(e, key, info) {
    tooltip.innerHTML = info.name + '<span class="cs-tt-status">' + (info.unlocked ? 'Explore \u2192' : 'Coming soon') + '</span>';
    tooltip.classList.add('show');
    moveTooltip(e);
  }
  function moveTooltip(e) {
    var rect = mapWrap.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    tooltip.style.left = (clientX - rect.left) + 'px';
    tooltip.style.top = (clientY - rect.top) + 'px';
  }
  function hideTooltip() { tooltip.classList.remove('show'); }

  /* Passport stamp row (mirrors the map, better for touch/mobile) */
  Object.keys(REGION_DATA).forEach(function (key) {
    var info = REGION_DATA[key];
    var el = document.createElement(info.unlocked ? 'a' : 'div');
    el.className = 'cs-stamp ' + (info.unlocked ? 'unlocked' : 'locked');
    if (info.unlocked) {
      el.href = info.url || '#';
      el.target = '_top';
    }
    var dot = document.createElement('span');
    dot.className = 'cs-dot';
    if (info.unlocked) dot.style.background = 'var(--c-' + key + ')';
    var label = document.createElement('span');
    label.innerHTML = info.name + '<span class="cs-status">' + (info.unlocked ? 'Stamped' : 'Locked') + '</span>';
    el.appendChild(dot);
    el.appendChild(label);
    stampsWrap.appendChild(el);
  });
})();
</script>
